var APP = "https://script.google.com/macros/s/AKfycbxglVQKBvsnks_7C_XnrLXEx0GiIoZFT4xjSTDQ74YPVP_sAA-DaVlJdG_6Tvnx1Gk/exec", KUNCI = "arabelleStudioToken";
var q = new URLSearchParams(location.search), t = q.get("t") || "";
try { if (t) localStorage.setItem(KUNCI, t); else t = localStorage.getItem(KUNCI) || ""; } catch (e) {}
if (q.get("t")) history.replaceState(null, "", location.pathname);
var f = document.getElementById("app");
f.src = APP + "?app=1&w=1" + (t ? "&t=" + encodeURIComponent(t) : "");
function tampil() { f.classList.add("siap"); document.getElementById("splash").classList.add("hilang"); }
addEventListener("message", function (e) {
  var d = e.data || {};
  if (d.arabelleToken) { try { localStorage.setItem(KUNCI, d.arabelleToken); } catch (x) {} }
  if (d.arabelleLogout) { try { localStorage.removeItem(KUNCI); } catch (x) {} }
  if (d.arabelleSiap) tampil();
  if (d.arabelleReload) location.reload();
});
setTimeout(function () { document.getElementById("st").textContent = "Sebentar lagi…"; }, 8000);
setTimeout(tampil, 30000);
</script>
</body></html>
