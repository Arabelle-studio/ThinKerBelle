<style>
html,body{margin:0;height:100%;background:#FCF4F3;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .35s}
iframe.siap{opacity:1}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:system-ui,-apple-system,sans-serif;color:#E0306F;transition:opacity .35s;z-index:2}
#splash img{width:112px;height:112px;border-radius:26px;object-fit:contain;box-shadow:0 12px 30px rgba(224,48,111,.28);animation:f 1.6s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-8px)}}
#splash b{font-size:22px}#splash small{color:#9A6A80;font-size:14px}
#splash .tg{font-style:normal;font-size:15px;letter-spacing:.06em;color:#E0306F;opacity:0;animation:tg .8s ease .3s forwards}@keyframes tg{to{opacity:1}}#splash small{margin-top:10px}
#splash.hilang{opacity:0;pointer-events:none}
@media (prefers-color-scheme:dark){html,body{background:#1E1016}#splash .tg{color:#FF8DB8}#splash{color:#FF8DB8}#splash small{color:#C99BB0}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}}
</style></head>
